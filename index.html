<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北基宜花金馬分署班級總覽</title>
<style>
/* Glassmorphism: translucent panels with blur over a soft color field.
   Colors are tokens; the dark theme swaps the field and the glass tint. */
:root {
  --field-1: #bfe7e1;
  --field-2: #d9dcff;
  --field-3: #ffe3c7;
  --glass: rgba(255, 255, 255, 0.52);
  --glass-strong: rgba(255, 255, 255, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --glass-shadow: 0 10px 40px rgba(37, 52, 92, 0.14);
  --fg: #16202a;
  --muted: #56606b;
  --accent: #0f6f68;
  --accent-ink: #ffffff;
  --track: rgba(22, 32, 42, 0.10);
  --bar-from: #2aa39a;
  --bar-to: #5ccbb4;
  --mark: #16202a;
  --open: #0d7444;
  --open-bg: rgba(40, 180, 110, 0.16);
  --pre: #8a5a00;
  --pre-bg: rgba(230, 170, 40, 0.20);
  --closed: #56606b;
  --closed-bg: rgba(90, 100, 110, 0.14);
  --warn: #9b2c2c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --field-1: #0f3b3a;
    --field-2: #1f2350;
    --field-3: #3d2a18;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --glass-edge: rgba(255, 255, 255, 0.16);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    --fg: #eef3f6;
    --muted: #a7b1bb;
    --accent: #7fe0d4;
    --accent-ink: #0b1f1d;
    --track: rgba(255, 255, 255, 0.12);
    --bar-from: #37b8ac;
    --bar-to: #8ff0de;
    --mark: #eef3f6;
    --open: #7ee8a8;
    --open-bg: rgba(60, 200, 120, 0.18);
    --pre: #f2c46d;
    --pre-bg: rgba(230, 170, 40, 0.18);
    --closed: #a7b1bb;
    --closed-bg: rgba(255, 255, 255, 0.08);
    --warn: #ffa3a3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --field-1: #0f3b3a;
  --field-2: #1f2350;
  --field-3: #3d2a18;
  --glass: rgba(255, 255, 255, 0.07);
  --glass-strong: rgba(255, 255, 255, 0.12);
  --glass-edge: rgba(255, 255, 255, 0.16);
  --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  --fg: #eef3f6;
  --muted: #a7b1bb;
  --accent: #7fe0d4;
  --accent-ink: #0b1f1d;
  --track: rgba(255, 255, 255, 0.12);
  --bar-from: #37b8ac;
  --bar-to: #8ff0de;
  --mark: #eef3f6;
  --open: #7ee8a8;
  --open-bg: rgba(60, 200, 120, 0.18);
  --pre: #f2c46d;
  --pre-bg: rgba(230, 170, 40, 0.18);
  --closed: #a7b1bb;
  --closed-bg: rgba(255, 255, 255, 0.08);
  --warn: #ffa3a3;
  color-scheme: dark;
}

/* Dropdown menus need a solid background; the glass tint lets the popup show as a light panel with light text. */
:root { --menu-bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --menu-bg: #1d2428; }
}
:root[data-theme="dark"] { --menu-bg: #1d2428; }
.filters select {
  background-color: var(--menu-bg);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.filters select option {
  background-color: var(--menu-bg);
  color: var(--fg);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--field-2); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--fg);
  font: 15px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  background:
    radial-gradient(60vmax 60vmax at 8% 8%, var(--field-1), transparent 70%),
    radial-gradient(55vmax 55vmax at 95% 15%, var(--field-2), transparent 70%),
    radial-gradient(50vmax 50vmax at 60% 100%, var(--field-3), transparent 70%),
    var(--field-2);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
main, header { max-width: 1140px; margin: 0 auto; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-shadow);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-strong); }
}

/* Header */
.hero {
  border-radius: 24px;
  padding: 26px 28px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px 20px;
}
.hero h1 { font-size: clamp(1.4rem, 3.6vw, 1.9rem); margin: 0 0 4px; letter-spacing: 0.02em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.hero-meta { font-size: 0.82rem; color: var(--muted); text-align: right; max-width: 100%; }

/* Summary */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin: 18px 0 18px;
}
.stat { border-radius: 18px; padding: 16px 18px; }
.stat b { display: block; font-size: 1.8rem; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { color: var(--muted); font-size: 0.86rem; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.filters input, .filters select {
  font: inherit;
  color: var(--fg);
  background: var(--glass-strong);
  border: 1px solid var(--glass-edge);
  border-radius: 12px;
  padding: 9px 12px;
  min-width: 0;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.filters input { flex: 1 1 240px; }
.filters input::placeholder { color: var(--muted); }
.filters input:focus, .filters select:focus, .chip:focus-visible, .card a:focus-visible, .card summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit;
  font-size: 0.86rem;
  color: var(--muted);
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 999px;
  padding: 5px 14px;
  cursor: pointer;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: transparent; font-weight: 600; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  font-size: 0.82rem;
  color: var(--muted);
  margin: 0 0 18px;
}
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; }
.legend .l-fill { background: linear-gradient(90deg, var(--bar-from), var(--bar-to)); }
.legend .l-mark { background: var(--mark); width: 3px; height: 14px; border-radius: 2px; }

/* Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
  gap: 18px;
}
.card {
  border-radius: 22px;
  padding: 18px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.card:hover { transform: translateY(-3px); }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 0.76rem; font-weight: 700; padding: 3px 11px; border-radius: 999px; }
.pill.open { color: var(--open); background: var(--open-bg); }
.pill.pre { color: var(--pre); background: var(--pre-bg); }
.pill.closed { color: var(--closed); background: var(--closed-bg); }
.tag {
  font-size: 0.76rem;
  color: var(--muted);
  border: 1px solid var(--glass-edge);
  background: var(--glass-strong);
  border-radius: 999px;
  padding: 1px 9px;
}
.card h3 { font-size: 1.02rem; margin: 0; line-height: 1.45; text-wrap: balance; overflow-wrap: anywhere; font-weight: 700; }
.card h3 a { color: inherit; text-decoration: none; background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0 2px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size 0.2s ease; }
.card h3 a:hover { background-size: 100% 2px; color: var(--accent); }

/* Enrollment bar: full = 1.6 x quota; the tick marks the quota (預訓人數) */
.enroll { display: flex; flex-direction: column; gap: 8px; }
.enroll-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.enroll-num { font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.enroll-num strong { color: var(--fg); font-size: 1.4rem; font-weight: 700; }
.enroll-pct { font-size: 0.9rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 12px; background: var(--track); border-radius: 999px; }
.bar > i {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--bar-from), var(--bar-to));
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(60, 200, 180, 0.35);
}
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--mark); border-radius: 2px; }
.bar-scale { position: relative; height: 16px; font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.bar-scale span:first-child { transform: none; }
.bar-scale span:last-child { transform: translateX(-100%); }
.hint { font-size: 0.82rem; font-weight: 600; }
.hint.ok { color: var(--open); }
.enroll-stamp { font-size: 0.74rem; color: var(--muted); }
.hint.warn { color: var(--pre); }
.note-box { font-size: 0.84rem; color: var(--muted); border: 1px dashed var(--glass-edge); border-radius: 12px; padding: 8px 10px; background: var(--glass); }

dl { margin: 0; display: grid; grid-template-columns: 4.6em 1fr; gap: 6px 12px; font-size: 0.88rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.card-foot { border-top: 1px solid var(--glass-edge); padding-top: 10px; margin-top: auto; }
details { font-size: 0.88rem; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " +"; }
details[open] summary::after { content: " −"; }
details dl { margin-top: 10px; }

.empty { color: var(--muted); padding: 28px 0; text-align: center; }
.error { color: var(--warn); }
footer {
  margin-top: 36px;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.8;
  border-radius: 18px;
  padding: 14px 18px;
}
</style>
</head>
<body>
<header class="hero glass">
  <div>
    <h1>北基宜花金馬分署 班級報名總覽</h1>
    <p>職前與在職班級的報名情況，資料來自職業訓練整合網</p>
  </div>
  <div class="hero-meta" id="updated">資料載入中…</div>
</header>

<main>
  <section class="stats" aria-label="統計">
    <div class="stat glass"><b id="s-total">–</b><span>班級數</span></div>
    <div class="stat glass"><b id="s-open">–</b><span>目前報名中</span></div>
    <div class="stat glass"><b id="s-kind">–</b><span>在職 / 職前</span></div>
  </section>

  <div class="filters">
    <input id="q" type="search" placeholder="搜尋班名、職類、地點、窗口…" aria-label="搜尋">
    <div class="chips" id="f-status" role="group" aria-label="報名狀態">
      <button class="chip" data-v="all" aria-pressed="true">全部狀態</button>
      <button class="chip" data-v="open" aria-pressed="false">報名中</button>
      <button class="chip" data-v="pre" aria-pressed="false">尚未開放</button>
      <button class="chip" data-v="closed" aria-pressed="false">已截止</button>
    </div>
    <select id="f-kind" aria-label="性質">
      <option value="all">職前/在職</option>
      <option value="在職">在職訓練</option>
      <option value="職前">職前訓練</option>
    </select>
    <select id="f-site" aria-label="訓練場地">
      <option value="all">訓練場/教室</option>
      <option value="基隆">基隆</option>
      <option value="五股">五股</option>
      <option value="泰山">泰山</option>
      <option value="宜蘭">宜蘭</option>
      <option value="花蓮">花蓮</option>
      <option value="六堵">六堵</option>
      <option value="金門">金門</option>
    </select>
    <select id="f-sort" aria-label="排序">
      <option value="reg">依報名開始</option>
      <option value="enroll">依報名人數（多到少）</option>
    </select>
  </div>

  <div class="legend" aria-hidden="true">
    <span><i class="l-fill"></i>已報名</span>
    <span><i class="l-mark"></i>預訓人數（開班門檻）</span>
    <span>整條滿格 = 預訓人數 × 1.6（可辦理甄試的門檻）</span>
  </div>

  <p class="empty" id="status-msg">資料載入中…</p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>沒有符合條件的班級。</p>

  <footer class="glass">
    報名人數與名額取自各班明細頁，實際以原網站公告為準。依招生規定，報名人數需達預訓人數 1.6 倍才能辦理甄試。資料每日中午 12 點與半夜 12 點自動更新。
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = { open: '報名中', pre: '尚未開放', closed: '已截止' };

// Enrollment thresholds: quota is the class size (預訓人數); 1.6x is the bar to hold the exam.
const EXAM_RATIO = 1.6;
const examNeed = c => c.quota ? Math.ceil(c.quota * EXAM_RATIO) : null;

// "Today" in Taiwan, as YYYY-MM-DD, so status matches the site's own dates.
const todayTW = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

let DATA = [];
let statusFilter = 'all';

// Training venue group. 六堵 and 金門 are checked before 基隆 so their addresses don't fall into it.
// The class name is checked too, since one 六堵 class's address only says 七堵.
const SITE_KEYS = ['六堵', '金門', '基隆', '五股', '泰山', '宜蘭', '花蓮'];
function siteOf(c) {
  const text = `${c.name || ''} ${c.location || ''} ${c.city || ''}`;
  return SITE_KEYS.find(k => text.includes(k)) || '';
}

function statusOf(c, today) {
  if (!c.regStart || !c.regEnd) return 'closed';
  if (today < c.regStart) return 'pre';
  if (today <= c.regEnd) return 'open';
  return 'closed';
}

const fmtRange = (a, b) => a && b ? `${a.replaceAll('-', '/')} ～ ${b.replaceAll('-', '/')}` : '—';

function enrollBlock(c) {
  if (c.enrolled == null || !c.quota) {
    return `<div class="note-box">報名人數未取得</div>`;
  }
  const need = examNeed(c);
  const pct = c.enrolled / need * 100;
  const fill = Math.min(100, pct);
  const mark = (c.quota / need * 100).toFixed(2);
  const hint = c.enrolled >= need
    ? `<span class="hint ok">已達 1.6 倍，可辦理甄試</span>`
    : c.enrolled >= c.quota
      ? `<span class="hint warn">已達預訓人數，尚差 ${need - c.enrolled} 人達 1.6 倍</span>`
      : `<span class="hint warn">尚差 ${c.quota - c.enrolled} 人達預訓人數</span>`;
  return `
    <div class="enroll">
      <div class="enroll-top">
        <div class="enroll-num"><strong>${c.enrolled}</strong> 人已報名</div>
        <div class="enroll-pct">${Math.round(pct)}%</div>
      </div>
      <div class="bar" role="progressbar" aria-label="報名進度" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${c.enrolled}">
        <i style="width:${fill.toFixed(2)}%"></i>
        <b style="left:${mark}%"></b>
      </div>
      <div class="bar-scale"><span style="left:0">0</span><span style="left:${mark}%">預訓 ${c.quota}</span><span style="left:100%">1.6 倍 ${need}</span></div>
      ${hint}
      ${c.detailUpdatedAt ? `<div class="enroll-stamp">人數更新於 ${esc(c.detailUpdatedAt.slice(0, 16).replace('T', ' '))}</div>` : ''}
    </div>`;
}

function card(c, today) {
  const st = statusOf(c, today);
  return `<article class="card glass ${st}">
    <div class="card-top">
      <span class="pill ${st}">${LABEL[st]}</span>
      <span class="tag">${esc(c.source)}</span>
      ${c.city ? `<span class="tag">${esc(c.city)}</span>` : ''}
    </div>
    <h3><a href="${esc(c.url)}" target="_blank" rel="noopener" title="開啟班級明細">${esc(c.name)}</a></h3>
    ${enrollBlock(c)}
    <dl>
      <dt>報名期間</dt><dd>${fmtRange(c.regStart, c.regEnd)}</dd>
      <dt>訓練期間</dt><dd>${fmtRange(c.trainStart, c.trainEnd)}</dd>
      <dt>訓練時數</dt><dd>${c.hours != null ? c.hours + ' 小時' : '—'}</dd>
      <dt>甄試日期</dt><dd>${esc(c.exam || '—')}</dd>
    </dl>
    <div class="card-foot">
      <details>
        <summary>更多資訊</summary>
        <dl>
          <dt>上課地點</dt><dd>${esc(c.location || '—')}</dd>
          <dt>上課時間</dt><dd>${esc(c.time || '—')}</dd>
          <dt>職類</dt><dd>${esc(c.category || '—')}</dd>
          <dt>窗口</dt><dd>${esc(c.contact || '—')}</dd>
          <dt>電話</dt><dd>${esc(c.phone || '—')}</dd>
          <dt>班級代碼</dt><dd>${esc(c.code || '—')}</dd>
        </dl>
      </details>
    </div>
  </article>`;
}

function render() {
  const today = todayTW();
  const q = $('q').value.trim().toLowerCase();
  const kind = $('f-kind').value;
  const site = $('f-site').value;
  const sort = $('f-sort').value;

  const list = DATA.filter(c =>
    (statusFilter === 'all' || statusOf(c, today) === statusFilter) &&
    (kind === 'all' || c.source === kind) &&
    (site === 'all' || siteOf(c) === site) &&
    (!q || [c.name, c.category, c.location, c.contact, c.code, c.city].join(' ').toLowerCase().includes(q))
  );
  // 職前 classes come first; 在職訓練 classes are listed after them.
  const kindRank = c => (c.source === '在職' ? 1 : 0);
  list.sort((a, b) => {
    if (kindRank(a) !== kindRank(b)) return kindRank(a) - kindRank(b);
    if (sort === 'enroll') return (b.enrolled ?? -1) - (a.enrolled ?? -1);
    return (a.regStart || '').localeCompare(b.regStart || '');
  });

  $('grid').innerHTML = list.map(c => card(c, today)).join('');
  $('empty').hidden = list.length > 0;

  // Summary counts the whole dataset, not the filtered view.
  $('s-total').textContent = DATA.length;
  $('s-open').textContent = DATA.filter(c => statusOf(c, today) === 'open').length;
  const zai = DATA.filter(c => c.source === '在職').length;
  $('s-kind').textContent = `${zai} / ${DATA.length - zai}`;
}

document.querySelectorAll('#f-status .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    statusFilter = btn.dataset.v;
    document.querySelectorAll('#f-status .chip').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
});
['q', 'f-kind', 'f-site', 'f-sort'].forEach(id => $(id).addEventListener('input', render));

fetch('data/classes.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    DATA = data.classes || [];
    const failed = (data.failed || []).length;
    $('updated').textContent = `資料更新時間 ${data.updatedAt.replace('T', ' ')}｜查詢期間 ${data.window}` +
      (failed ? `｜${failed} 班明細頁未能讀取` : '');
    $('status-msg').hidden = true;
    render();
  })
  .catch(() => {
    $('updated').textContent = '無法載入班級資料，請稍後重新整理。';
    $('updated').classList.add('error');
    $('status-msg').hidden = true;
  });
</script>
</body>
</html>
